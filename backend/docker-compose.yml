version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: thermal_user
      POSTGRES_PASSWORD: thermal_pass
      POSTGRES_DB: thermal_db
    ports:
      - "5432:5432"
    volumes:
      - thermal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thermal_user -d thermal_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://thermal_user:thermal_pass@db:5432/thermal_db
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  thermal_pgdata:
